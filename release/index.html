            --card-bg: rgba(13, 15, 24, 0.88);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent-cyan: #00f0ff;
            --accent-purple: #7000ff;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.65);
            --font-main: 'Outfit', sans-serif;
            --font-heading: 'Space Grotesk', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: var(--font-main);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 2.5rem 1rem;
            position: relative;
            overflow-x: hidden;

        /* Ambient Dynamic Background Art */
        .ambient-backdrop {
            position: fixed;
            inset: -40px;
            background-size: cover;
            background-position: center;
            filter: blur(55px) brightness(0.28) saturate(1.4);
            transform: scale(1.1);
            z-index: 1;
            pointer-events: none;
            transition: background-image 0.8s ease;
        }

        .cyber-grid-overlay {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.02) 1px, transparent 1px);
            background-size: 36px 36px;
            z-index: 2;
            pointer-events: none;
        }

        /* Center Smart Link Hub Card */
        .smart-link-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 410px;
            background: var(--card-bg);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            box-shadow: 
                0 25px 60px rgba(0, 0, 0, 0.9),
                0 0 35px rgba(0, 240, 255, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            overflow: hidden;
            margin: 0 auto;
            animation: cardFadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardFadeUp {
            from { opacity: 0; transform: translateY(25px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Top Release Artwork & Snippet Player */
        .artwork-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #000;
            overflow: hidden;
        }

        .artwork-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .artwork-container:hover .artwork-img {
            transform: scale(1.03);
        }

        .artwork-overlay-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0) 40%, rgba(13, 15, 24, 0.95) 100%);
            pointer-events: none;
        }

        /* Snippet Play Button Overlay on Artwork */
        .artwork-play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(0, 240, 255, 0.92);
            color: #000;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            box-shadow: 
                0 0 30px rgba(0, 240, 255, 0.7),
                0 8px 25px rgba(0, 0, 0, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5;
        }

        .artwork-play-btn:hover {
            transform: translate(-50%, -50%) scale(1.1);
            background: #fff;
            box-shadow: 0 0 40px #00f0ff;
        }

        .artwork-play-btn.playing {
            background: #fff;
            animation: pulseGlow 1.8s infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 25px rgba(0, 240, 255, 0.8); }
            50% { box-shadow: 0 0 45px rgba(0, 240, 255, 1); }

            background: #111111;
            color: #ffffff;
            transform: scale(1.03);
        }

        /* Footer & Share Bar */
        .card-footer {
            padding: 0.8rem 1.4rem 1.4rem 1.4rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;

            letter-spacing: 0.06rem;

        /* Loading / Error States */
        .loading-view {
            padding: 4rem 2rem;
            text-align: center;

        .cyber-spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(0, 240, 255, 0.2);
            border-top-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1.2rem auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }

        /* Cyber Toast Notification */
        .cyber-toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            background: rgba(6, 8, 16, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--accent-cyan);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
            border-radius: 30px;
            padding: 0.65rem 1.4rem;
            color: #fff;
            font-family: var(--font-heading);
            font-size: 0.78rem;
            font-weight: 700;
            z-index: 10000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .cyber-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .cyber-toast i {
            color: var(--accent-cyan);

        /* Mobile specific adjustments */
        @media (max-width: 480px) {
            body {
                padding: 1rem 0.6rem;
            }
            .smart-link-card {
                border-radius: 20px;
            }
            .track-title {
                font-size: 1.25rem;
            }
            .platform-row {
                padding: 0.85rem 1rem;
            }
            .platform-logo-svg {
                max-width: 110px;
            }
        }

        // --- 3. TOAST NOTIFICATION ---
        function showToast(text, icon = "fas fa-check-circle") {
            const toast = document.getElementById('cyber-toast');
            const toastText = document.getElementById('toast-text');
            if (!toast || !toastText) return;
            toastText.textContent = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2800);
        }

        // --- 4. EXTRACT SLUG/ID FROM URL ---
        function getReleaseId() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('id')) return params.get('id').trim();
            if (params.get('track')) return params.get('track').trim();
            if (params.get('release')) return params.get('release').trim();
            
            // Or from path: /release/nuts-funk
            const pathParts = window.location.pathname.split('/').filter(Boolean);
            if (pathParts.length > 1 && pathParts[0] === 'release') {
                return pathParts[1].replace('.html', '').trim();
            }
            return null;
        }

        // --- 5. AUDIO PREVIEW PLAYER ENGINE ---
        let isAudioPlaying = false;
        let ytSnippetPlayer = null;
        let previewAudioEl = document.getElementById('snippet-audio');
        let currentAudioSrc = '';
        let currentYtId = '';

        function toggleAudioPlayback() {
            const playBtn = document.getElementById('play-snippet-btn');
            const playIcon = document.getElementById('snippet-play-icon');

            if (isAudioPlaying) {
                // Pause
                if (previewAudioEl) previewAudioEl.pause();
                if (ytSnippetPlayer && ytSnippetPlayer.pauseVideo) ytSnippetPlayer.pauseVideo();
                isAudioPlaying = false;
                if (playBtn) playBtn.classList.remove('playing');
                if (playIcon) playIcon.className = 'fas fa-play';
            } else {
                // Play
                if (currentAudioSrc && currentAudioSrc.startsWith('http') && (currentAudioSrc.includes('.mp3') || currentAudioSrc.includes('audio') || !currentAudioSrc.includes('youtube.com'))) {
                    previewAudioEl.src = currentAudioSrc;
                    previewAudioEl.play().then(() => {
                        isAudioPlaying = true;
                        if (playBtn) playBtn.classList.add('playing');
                        if (playIcon) playIcon.className = 'fas fa-pause';
                    }).catch(e => console.log(e));
                } else if (currentYtId) {
                    if (ytSnippetPlayer && ytSnippetPlayer.playVideo) {
                        ytSnippetPlayer.seekTo(0, true);
                        ytSnippetPlayer.playVideo();
                        isAudioPlaying = true;
                        if (playBtn) playBtn.classList.add('playing');
                        if (playIcon) playIcon.className = 'fas fa-pause';
                    }
                } else {
                    showToast("No Audio Preview Configured", "fas fa-info-circle");
                }
            }
        }

        if (previewAudioEl) {
            previewAudioEl.addEventListener('ended', () => {
                isAudioPlaying = false;
                const playBtn = document.getElementById('play-snippet-btn');
                const playIcon = document.getElementById('snippet-play-icon');
                if (playBtn) playBtn.classList.remove('playing');
                if (playIcon) playIcon.className = 'fas fa-play';
            });
        }

        // YouTube iFrame Setup for Preview
        window.onYouTubeIframeAPIReady = function() {
            if (currentYtId) initYtSnippet(currentYtId);
        };

        function initYtSnippet(vidId) {
            if (!vidId) return;
            try {
                ytSnippetPlayer = new YT.Player('yt-player-slot', {
                    height: '1',
                    width: '1',
                    videoId: vidId,
                    playerVars: { autoplay: 0, controls: 0, disablekb: 1, fs: 0, rel: 0 },
                    events: {
                        'onStateChange': function(event) {
                            if (event.data === YT.PlayerState.ENDED) {
                                isAudioPlaying = false;
                                const playBtn = document.getElementById('play-snippet-btn');
                                const playIcon = document.getElementById('snippet-play-icon');
                                if (playBtn) playBtn.classList.remove('playing');
                                if (playIcon) playIcon.className = 'fas fa-play';
                            }
                        }
                    }
                });
            } catch(e) {}
        }

        // --- 6. RENDER SMART LINK DATA ---
        function renderSmartLink(data) {
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('content-state').style.display = 'block';

            const title = data.title || data.name || "OBSCURA RELEASE";
            const artist = data.artist || data.producers || "OBSCURA RECORD";
            const cover = data.image || data.artwork || data.cover || "../assets/OCR.png";
            const audioSrc = data.audioPreview || data.previewAudio || data.mp3 || "";
            const ytUrl = data.youtube || data.youtubeUrl || "";

            // Set Page Titles & Metadata
            document.title = `${title} - ${artist} | OBSCURA RECORD`;
            document.getElementById('track-title').textContent = title;
            document.getElementById('track-artist').textContent = artist || "OBSCURA RECORD";
            
            // Set Cover & Ambient Background
            document.getElementById('track-cover').src = cover;
            document.getElementById('ambient-bg').style.backgroundImage = `url('${cover}')`;

            // Prepare Audio
            currentAudioSrc = audioSrc;
            if (ytUrl) {
                const match = ytUrl.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
                if (match && match[1]) {
                    currentYtId = match[1];
                    if (window.YT && window.YT.Player) initYtSnippet(currentYtId);
                }
            }

            // Build Platform Links List
            const platformListEl = document.getElementById('platform-list');
            platformListEl.innerHTML = '';

            const links = data.links || data;
            const availablePlatforms = [
                'spotify', 'apple', 'itunes', 'deezer', 'amazon', 
                'youtube', 'youtubemusic', 'tidal', 'pandora', 
                'boomplay', 'soundcloud', 'beatport', 'tiktok'
            ];

            let renderedCount = 0;
            availablePlatforms.forEach(key => {
                const url = links[key] || links[`${key}Url`] || (data[key] && typeof data[key] === 'string' ? data[key] : null);
                if (url && url !== '#' && url.trim().length > 3) {
                    const cfg = PLATFORM_CONFIG[key] || {
                        name: key.toUpperCase(),
                        action: "Play",
                        logoColor: "#111",
                        iconClass: "fas fa-play"
                    };

                    const row = document.createElement('a');
                    row.href = url;
                    row.target = '_blank';
                    row.rel = 'noopener noreferrer';
                    row.className = 'platform-row';
                    row.innerHTML = `
                        <div class="platform-brand">
                            <i class="${cfg.iconClass}" style="font-size: 1.45rem; color: ${cfg.logoColor}; min-width: 24px; text-align: center;"></i>
                            <span style="font-weight: 800; font-size: 0.95rem; color: #111;">${cfg.name}</span>
                        </div>
                        <span class="platform-action-btn">${cfg.action}</span>
                    `;
                    platformListEl.appendChild(row);
                    renderedCount++;
                }
            });

            // If no individual links were provided, provide default Spotify and YouTube search/portal links
            if (renderedCount === 0) {
                const fallbackPlatforms = [
                    { name: "Spotify", url: "https://open.spotify.com/", icon: "fab fa-spotify", color: "#1DB954", action: "Play" },
                    { name: "Apple Music", url: "https://music.apple.com/", icon: "fab fa-apple", color: "#FA233B", action: "Play" },
                    { name: "YouTube", url: "https://youtube.com/", icon: "fab fa-youtube", color: "#FF0000", action: "Watch" },
                    { name: "SoundCloud", url: "https://soundcloud.com/", icon: "fab fa-soundcloud", color: "#FF5500", action: "Stream" }
                ];
                fallbackPlatforms.forEach(p => {
                    const row = document.createElement('a');
                    row.href = p.url;
                    row.target = '_blank';
                    row.className = 'platform-row';
                    row.innerHTML = `
                        <div class="platform-brand">
                            <i class="${p.icon}" style="font-size: 1.4rem; color: ${p.color};"></i>
                            <span style="font-weight: 800; font-size: 0.95rem; color: #111;">${p.name}</span>
                        </div>
                        <span class="platform-action-btn">${p.action}</span>
                    `;
                    platformListEl.appendChild(row);
                });
            }

            // Play Button Event Listener
            const playBtn = document.getElementById('play-snippet-btn');
            if (playBtn) {
                playBtn.addEventListener('click', toggleAudioPlayback);
            }

            // Share Button Event Listener
            const shareBtn = document.getElementById('share-btn');
            if (shareBtn) {
                shareBtn.addEventListener('click', () => {
                    const shareUrl = window.location.href;
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(shareUrl).then(() => {
                            showToast("LINK COPIED TO CLIPBOARD!");
                        }).catch(() => {
                            showToast("TRANSMISSION LINK READY");
                        });
                    } else {
                        showToast("LINK COPIED!");
                    }
                });
            }
        }

        // --- 7. NOT FOUND / TERMINATED TRANSMISSION VIEW ---
        function renderNotFound(slug = '') {
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('content-state').style.display = 'block';

            document.title = '404 // TRANSMISSION TERMINATED | OBSCURA RECORD';
            document.getElementById('ambient-bg').style.backgroundImage = "url('../assets/OCR.png')";

            const card = document.getElementById('smart-link-card');
            if (card) {
                card.innerHTML = `
                    <div style="padding: 3.2rem 1.8rem; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1rem;">
                        <div style="width: 72px; height: 72px; border-radius: 50%; background: rgba(255, 0, 85, 0.12); border: 1.5px solid #ff0055; display: flex; align-items: center; justify-content: center; color: #ff0055; font-size: 1.8rem; box-shadow: 0 0 30px rgba(255, 0, 85, 0.35); margin-bottom: 0.5rem;">
                            <i class="fas fa-satellite-dish"></i>
                        </div>

                        <div class="label-name" style="font-size: 0.75rem; letter-spacing: 0.2rem; color: rgba(255, 255, 255, 0.5);">
                            OBSCURA <span style="color: #00f0ff;">RECORD</span>
                        </div>

                        <h1 style="font-family: var(--font-heading); font-size: 1.35rem; font-weight: 900; color: #fff; letter-spacing: 0.06rem; text-transform: uppercase;">
                            TRANSMISSION TERMINATED
                        </h1>

                        <p style="font-size: 0.82rem; color: rgba(255, 255, 255, 0.65); line-height: 1.6; max-width: 320px; margin-bottom: 1.2rem;">
                            We are sorry, this release link has been archived, deleted, or is no longer broadcasting on this frequency.
                        </p>

                        <a href="../" class="share-hub-btn" style="text-decoration: none; padding: 0.75rem 1.8rem; font-size: 0.82rem; background: rgba(0, 240, 255, 0.15); border-color: var(--accent-cyan); color: #fff; display: inline-flex; box-shadow: 0 0 20px rgba(0, 240, 255, 0.25);">
                            <i class="fas fa-globe"></i> RETURN TO OBSCURA PORTAL
                        </a>

                        <div style="margin-top: 2rem; font-size: 0.65rem; color: rgba(255, 255, 255, 0.35); letter-spacing: 0.05rem;">
                            &copy; 2026 <a href="../" style="color: var(--accent-cyan); text-decoration: none;">OBSCURA RECORD</a>. ALL RIGHTS RESERVED.
                        </div>
                    </div>
                `;
            }
        }

        // --- 8. FETCH RELEASE DATA FROM FIREBASE ---
        const releaseId = getReleaseId();

        if (!releaseId) {
            renderNotFound();
        } else {
            // Check dedicated smartLinks/{id}
            db.ref(`smartLinks/${releaseId}`).once('value').then(snap => {
                const val = snap.val();
                if (val) {
                    renderSmartLink(val);
                } else {
                    renderNotFound(releaseId);
                }
            }).catch(err => {
                console.error("Firebase fetch error:", err);
                renderNotFound(releaseId);
            });
        }
    </script>
</body>
</html>
